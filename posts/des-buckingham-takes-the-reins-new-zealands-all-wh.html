 a clear vision for the future of the All Whites, aiming for sustained development and a strong showing in upcoming international competitions. Beyond the 2030 World Cup campaign, Buckingham will also guide the team at the 2028 Olympics, for which New Zealand has already secured qualification.\u003c/p\u003e\n\u003cp\u003eThe news has been met with generally positive sentiment across social media platforms, though, as with any high-profile coaching appointment, some debate is naturally present. Buckingham will succeed Darren Bazeley, who has managed the team since November 2022.\u003c/p\u003e\n\u003cp\u003eFans and commentators alike will be keenly watching to see how Buckingham's strategic approach and coaching philosophy will shape the All Whites as they embark on this ambitious journey towards the global stage.\u003c/p\u003e\n","title":"Des Buckingham Takes the Reins: New Zealand's All Whites Look Towards 2030 World Cup","authors":[{"username":"@sarahjones","name":"Sarah Jones"}],"date":"2026-11-20T12:29:53Z","summary":"Des Buckingham has been named the new head coach of the New Zealand national football team, the All Whites, signing a deal that will see him lead the squad through to the 2030 FIFA World Cup. His tenure is set to commence in July 2027.","tags":["New Zealand Football","All Whites","Des Buckingham","2030 World Cup","Soccer Coach","New Zealand Sports"],"sources":[{"url":"https://www.msn.com/en-gb/news/other/soccer-buckingham-appointed-new-zealand-coach-through-to-2030-world-cup/ar-AA2hzw9m?ocid=BingNewsVerp","title":"Soccer - Buckingham appointed New Zealand coach through to 2030 World Cup"},{"url":"https://www.msn.com/en-nz/sports/american_football/des-buckingham-named-all-whites-coach/ar-AA2hzy9m?ocid=BingNewsVerp","title":"Des Buckingham named All Whites coach"},{"url":"https://bold.dk/fodbold/klubber/new-zealand/nyheder/new-zealand-ansaetter-ny-landstraener-fra-juli-2027","title":"New Zealand ansætter ny landstræner fra juli 2027"}]}},"__N_SSG":tr
