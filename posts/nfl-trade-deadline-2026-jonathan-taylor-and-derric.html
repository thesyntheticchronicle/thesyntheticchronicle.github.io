<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-7bc367af1df2b57e.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-609eda5bf9fae427.js" defer=""></script><script src="/_next/static/53T1-mXA4otRY0j3odZxk/_buildManifest.js" defer=""></script><script src="/_next/static/53T1-mXA4otRY0j3odZxk/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"nfl-trade-deadline-2026-jonathan-taylor-and-derric","contentHtml":"\u003cp\u003eAs the 2026 NFL trade deadline rapidly approaches, the league is abuzz with a flurry of rumors and high-impact trades. Teams are strategically positioning themselves for a postseason push or looking to offload assets for future gains, making for a thrilling period of roster upheaval.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThe Jonathan Taylor Saga Continues\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIndianapolis Colts running back Jonathan Taylor remains one of the most talked-about players. Despite being reportedly 'open to being traded,' the Colts are holding firm on their asking price, aiming to maximize their return. The New England Patriots have emerged as a strong contender for Taylor's services, while the New York Giants, initially making an offer, have reportedly withdrawn it, indicating a cautious approach to the Colts' demands. Taylor himself has acknowledged the possibility of his tenure in Indianapolis coming to an end, adding to the intrigue.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDerrick Henry: Will the Ravens Deal Their Star Back?\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAnother prominent name in the trade rumor mill is Baltimore Ravens running back Derrick Henry. With the Ravens' season hanging in the balance, several teams, including the Giants, have reportedly inquired about the impending free agent. However, Baltimore has so far resisted these overtures, seemingly committed to keeping Henry for their playoff aspirations.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eOther Key Players in the Rumor Mill\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eBeyond Taylor and Henry, a host of other players have been subjects of trade speculation. These include Lions TE Sam LaPorta, Titans RB Tony Pollard, Eagles DT Jordan Davis, Jets S Andre Cisco, Saints DT Davon Godchaux, Jets QB Geno Smith, Jets pass rusher Will McDonald, Falcons S Jessie Bates, and Cardinals TE Trey McBride. The ongoing discussions highlight the dynamic nature of the trade deadline, with teams exploring all options to improve their squads.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMajor Deals Already Shaking Up the League\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe 2026 trade deadline has already witnessed several significant transactions that have reshaped team dynamics:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eJacksonville Jaguars' Defensive Haul:\u003c/strong\u003e The Jaguars have been particularly active, acquiring DT Jordan Davis from the Philadelphia Eagles (for a 2027 first-round and 2029 second-round pick), DT Davon Godchaux from the New Orleans Saints (for a 2028 sixth-round pick), and S Jessie Bates from the Atlanta Falcons (for a second- and fifth-round pick). These moves clearly signal Jacksonville's intent to bolster its defense.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDetroit Lions Strengthen Secondary:\u003c/strong\u003e The New York Jets traded S Andre Cisco to the Detroit Lions for a 2028 sixth-round pick.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eQuarterback and Defensive Line Moves:\u003c/strong\u003e The Arizona Cardinals sent QB Jacoby Brissett and a fifth-round pick to the Baltimore Ravens for a fourth- and seventh-round pick. The Tennessee Titans traded DT Jeffery Simmons and a 2028 fifth-round pick to the Chicago Bears for two first-round picks and a 2027 fourth-round pick.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eColts and Cardinals Make Internal Changes:\u003c/strong\u003e The Indianapolis Colts traded DT DeForest Buckner to the San Francisco 49ers for a fourth-round pick and OG Quenton Nelson to the Seattle Seahawks for third- and fifth-round picks. The Arizona Cardinals traded WR Marvin Harrison Jr. to the Houston Texans for second- and sixth-round picks.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eSocial Media Reflects the Excitement\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eSocial media platforms are alight with discussions and debates surrounding the trade deadline, particularly concerning Jonathan Taylor. The sentiment is largely positive, reflecting the excitement and anticipation among fans as teams make crucial decisions that could impact their season's trajectory.\u003c/p\u003e\n\u003cp\u003eAs the final hours of the trade deadline tick away, the NFL landscape continues to evolve, promising an exciting conclusion to this period of intense negotiation and strategic maneuvering.\u003c/p\u003e\n","title":"NFL Trade Deadline 2026: Jonathan Taylor and Derrick Henry Dominate Rumors Amid Blockbuster Deals","authors":[{"username":"@elenvox","name":"Elen Vox"}],"date":"2026-11-10T09:28:30Z","summary":"The 2026 NFL trade deadline is buzzing with activity as teams make last-minute roster adjustments. Jonathan Taylor and Derrick Henry remain at the center of trade speculation, while several significant deals have already reshaped the league.","tags":["NFL","Trade Deadline","Jonathan Taylor","Derrick Henry","Football","Sports News","NFL Rumors"],"sources":[{"url":"https://sports.yahoo.com/articles/nfl-trade-deadline-tracker-live-132726230.html","title":"NFL trade deadline tracker: Live updates on news, rumors for Jonathan Taylor, Derrick Henry and more at 2026 deadline"},{"url":"https://www.msn.com/en-us/sports/football/jonathan-taylor-addresses-future-ahead-of-colts-trade-deadline-decision/ar-AA2h52Ml?ocid=BingNewsVerp","title":"Jonathan Taylor Addresses Future Ahead Of Colts’ Trade Deadline Decision"},{"url":"https://www.msn.com/en-us/news/other/they-called-the-ravens-on-derrick-henry-nfl-insider-reveals-nfc-contender-s-aggressive-stance-at-trade-deadline/ar-AA2h7l26?ocid=BingNewsVerp","title":"‘They Called the Ravens on Derrick Henry’ — NFL Insider Reveals NFC Contender’s Aggressive Stance at Trade Deadline"},{"url":"https://www.msn.com/en-us/news/other/jonathan-taylor-trade-rumors-4-potential-landing-spots-before-nfl-trade-deadline/ar-AA2h4Ym0?ocid=BingNewsVerp","title":"Jonathan Taylor Trade Rumors: 4 Potential Landing Spots Before NFL Trade Deadline"},{"url":"https://www.msn.com/en-us/news/other/jonathan-taylor-trade-rumors-patriots-emerge-among-4-teams-as-favorites-for-colts-rb/ar-AA2h5Uod?ocid=BingNewsVerp","title":"Jonathan Taylor trade rumors: Patriots emerge among 4 teams as favorites for Colts RB"},{"url":"https://www.msn.com/en-us/sports/football/giants-jonathan-taylor-and-what-can-still-happen-at-nfl-trade-deadline/ar-AA2h4Ri5?ocid=BingNewsVerp","title":"Giants, Jonathan Taylor and what can still happen at NFL trade deadline"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"nfl-trade-deadline-2026-jonathan-taylor-and-derric"},"buildId":"53T1-mXA4otRY0j3odZxk","isFallback":false,"gsp":true,"scriptLoader":[]}</script></
