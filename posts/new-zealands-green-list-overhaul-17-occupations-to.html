<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-7bc367af1df2b57e.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-609eda5bf9fae427.js" defer=""></script><script src="/_next/static/OJu3kvWpBlYiwPLYysN1_/_buildManifest.js" defer=""></script><script src="/_next/static/OJu3kvWpBlYiwPLYysN1_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"new-zealands-green-list-overhaul-17-occupations-to","contentHtml":"\u003cp\u003eNew Zealand's immigration landscape is undergoing a significant transformation, with the government announcing major changes to its Green List settings. Effective March 8, 2027, 17 occupations will be removed from the Work to Residence Visa pathway. This strategic overhaul is driven by the introduction of new Skilled Migrant Category (SMC) pathways in August 2026, designed to simplify the residence system and ensure the Green List aligns more closely with New Zealand's evolving workforce and immigration needs.\u003c/p\u003e\n\u003ch3\u003eThe Shift from Green List to New SMC Pathways\u003c/h3\u003e\n\u003cp\u003eThe 17 occupations being removed from the Tier 2 Green List will no longer offer a direct Work to Residence pathway. Instead, individuals in these roles will now be covered by two new SMC pathways: the Trades and Technician pathway and the Skilled Work Experience pathway.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eOccupations under the SMC Trades and Technician pathway (13 roles) include:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBuilding Associate (Building Construction Supervisor)\u003c/li\u003e\n\u003cli\u003eAutomotive Electrician\u003c/li\u003e\n\u003cli\u003eDiesel Motor Mechanic\u003c/li\u003e\n\u003cli\u003eMotor Mechanic (General)\u003c/li\u003e\n\u003cli\u003eMotorcycle Mechanic\u003c/li\u003e\n\u003cli\u003ePanel Beater\u003c/li\u003e\n\u003cli\u003eVehicle Painter\u003c/li\u003e\n\u003cli\u003eMetal Fabricator\u003c/li\u003e\n\u003cli\u003eWelder\u003c/li\u003e\n\u003cli\u003eFitter (General)\u003c/li\u003e\n\u003cli\u003eFitter and Turner\u003c/li\u003e\n\u003cli\u003eFitter-Welder\u003c/li\u003e\n\u003cli\u003eMetal Machinist (First Class)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eThe remaining four occupations will fall under the SMC Skilled Work Experience pathway:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCrane, Hoist or Lift Operator\u003c/li\u003e\n\u003cli\u003eTelecommunications Technician\u003c/li\u003e\n\u003cli\u003ePaving Plant Operator\u003c/li\u003e\n\u003cli\u003ePressure Welder\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMigrants pursuing residence through these new routes will need to meet specific qualification, work experience, wage, and other eligibility criteria. While these new pathways may offer more accessible options for some experienced workers—potentially through lower wage thresholds, shorter New Zealand work experience requirements, or no specified qualification—it's crucial to note that eligibility conditions vary, and the changes may not benefit everyone equally.\u003c/p\u003e\n\u003ch3\u003eImplications for Employers and Transitional Arrangements\u003c/h3\u003e\n\u003cp\u003eEmployers will still be able to recruit migrants for these occupations through the Accredited Employer Work Visa (AEWV), provided they meet the applicable requirements. However, existing Green List benefits for these roles, such as certain labor market test exemptions and priority processing for job check and AEWV applications, will no longer apply.\u003c/p\u003e\n\u003cp\u003eFor eligible workers already accumulating qualifying work experience under the Work to Residence Visa pathway, transitional arrangements are being introduced. Those who begin accumulating this experience before the changes take effect will be able to continue counting that time towards the existing 24-month work requirement, provided they satisfy all other residence criteria.\u003c/p\u003e\n\u003ch3\u003eOther Key Immigration Updates\u003c/h3\u003e\n\u003cp\u003eBeyond the Green List removals, several other significant changes are on the horizon:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eSpecial Education Teachers Get Direct Residence:\u003c/strong\u003e Four special education teaching roles – Special Needs Teacher, Teacher of the Hearing Impaired, Teacher of the Sight Impaired, and Special Education Teachers not elsewhere classified – will be elevated from the Work to Residence Visa category to the Straight to Residence Visa pathway. This allows eligible teachers in these critical roles to apply directly for residence without the previous two-year work requirement, aligning their pathway with other comparable teaching professions.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTighter Eligibility for Sterilisation Technicians:\u003c/strong\u003e Green List eligibility for Sterilisation Technicians will be restricted to graduate and registered members of the New Zealand Sterile Sciences Association, ensuring immigration requirements match professional standards.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCareer Counsellor Removed from Direct Residence:\u003c/strong\u003e The Career Counsellor occupation will be removed from the Tier 1 Green List, which grants Straight to Residence Visa eligibility. The government states this role no longer aligns with the original focus of allied healthcare additions, though Career Counsellors may still qualify for residence through other immigration pathways.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003eThe Rationale and Future Reviews\u003c/h3\u003e\n\u003cp\u003eThese changes underscore the government's commitment to simplifying New Zealand's immigration system, removing redundant pathways, and continually adapting to the country's workforce demands. The Green List is slated for another review in 2027 to ensure its ongoing relevance and effectiveness.\u003c/p\u003e\n\u003cp\u003ePublic sentiment regarding these immigration adjustments has been \u003cstrong\u003emostly positive, with some debate\u003c/strong\u003e around the specifics.\u003c/p\u003e\n\u003cp\u003eAs New Zealand refines its approach to skilled migration, prospective migrants and employers are advised to stay informed about these evolving requirements to navigate the pathways to residence successfully.\u003c/p\u003e\n","title":"New Zealand's Green List Overhaul: 17 Occupations to Lose Direct Residence Pathway by 2027","authors":[{"username":"@sarahjones","name":"Sarah Jones"}],"date":"2026-11-23T14:01:01Z","summary":"New Zealand is set to overhaul its Green List immigration settings, removing 17 occupations from the direct Work to Residence Visa pathway by March 2027. This significant shift aims to streamline the immigration system, re-aligning it with the country's workforce demands and introducing new Skilled Migrant Category pathways. Find out which jobs are affected and what these changes mean for prospective migrants and employers.","tags":["New Zealand","Immigration","Green List","Work Visa","Permanent Residence","Skilled Migrant Category","Workforce","Trades","Education","Healthcare"],"sources":[{"url":"https://www.msn.com/en-xl/news/other/new-zealand-announces-17-occupations-set-to-lose-green-list-residence-in-2027/ar-AA2i2E5u","title":"New Zealand announces 17 occupations set to lose Green List residence in 2027"},{"url":"https://www.indianweekender.co.nz/news/nz-green-list-shake-up-17-jobs-to-go","title":"NZ Green List shake-up: 17 jobs to go"},{"url":"https://www.msn.com/en-xl/news/other/new-zealand-changes-permanent-residency-rules-for-foreign-workers-lists-affected-jobs/ar-AA2h50jX?ocid=BingNewsVerp","title":"New Zealand changes permanent residency rules for foreign workers, lists affected jobs"},{"url":"https://www.msn.com/en-xl/news/other/new-zealand-to-grant-direct-permanent-residency-to-four-teaching-occupations-from-march-2027/ar-AA2gWLBd?ocid=BingNewsVerp","title":"New Zealand to grant direct permanent residency to four teaching occupations from March 2027"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"new-zealands-green-list-overhaul-17-occupations-to"},"buildId":"OJu3kvWpBlYiwPLYysN1_","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
