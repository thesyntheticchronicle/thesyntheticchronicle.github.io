<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-7bc367af1df2b57e.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-609eda5bf9fae427.js" defer=""></script><script src="/_next/static/7hGQ23-fU4EHqCi-994Ap/_buildManifest.js" defer=""></script><script src="/_next/static/7hGQ23-fU4EHqCi-994Ap/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"grab-philippines-appoints-cj-lacsican-as-new-count","contentHtml":"\u003cp\u003eMANILA, Philippines – In a significant leadership change, Grab, the everyday super app, has named CJ Lacsican as its new Country Managing Director for the Philippines, effective December 1, 2026. Lacsican, a seasoned leader within Grab's ranks, will succeed Ronald Roda, who is stepping down after an impactful eight-year tenure with the company to explore entrepreneurial opportunities.\u003c/p\u003e\n\u003cp\u003eLacsican's appointment is a testament to Grab's robust succession planning, with her promotion being the second consecutive internal leadership transition for the Philippine market. She has been an integral part of Grab's leadership team for nearly five years, having spearheaded key functions including Central Operations, Cities, Grab Financial Group, and most recently, Mobility \u0026#x26; Operations in the Philippines. Her extensive experience also includes nearly two decades in country, regional, and transformation leadership roles across leading global financial services groups in Asia and Europe.\u003c/p\u003e\n\u003cp\u003eRonald Roda, who served as Country Head and Managing Director for two years, will transition into a senior advisor and board executive role from December 1, supporting a phased handover until early 2027. His departure marks the end of a successful chapter, paving the way for new leadership.\u003c/p\u003e\n\u003cp\u003eFurther strengthening its leadership team, Grab has also announced additional strategic appointments. Alvin Ching, who joined Grab on November 3, 2026, has been named Director for Mobility and Operations. Additionally, Anton Bautista makes a return to Grab Philippines to lead the Deliveries and Commercial business, bringing back valuable regional experience from his previous roles in Grab’s Corporate Strategy and Marketplace teams.\u003c/p\u003e\n\u003cp\u003eThis leadership reshuffle underscores Grab's commitment to nurturing internal talent and reinforcing its operational and commercial strategies in the dynamic Philippine market.\u003c/p\u003e\n","title":"Grab Philippines Appoints CJ Lacsican as New Country Managing Director, Signaling Strategic Leadership Shift","authors":[{"username":"@miguelreyes","name":"Miguel Reyes"}],"date":"2026-11-14T13:18:58Z","summary":"Grab, the leading super app, has announced the appointment of CJ Lacsican as its new Country Managing Director for the Philippines, effective December 1, 2026. This internal promotion marks a strategic succession as Lacsican takes the helm from Ronald Roda, who departs to pursue entrepreneurial ventures.","tags":["Grab","Philippines","Leadership","Technology","Ride-hailing","Super App","Business","Appointments","CJ Lacsican"],"sources":[{"url":"https://www.msn.com/en-ph/money/executive-leadership-and-management/grab-gets-new-philippines-chief/ar-AA2hgGQ6?ocid=BingNewsVerp","title":"Grab gets new Philippines chief"},{"url":"https://www.gmanetwork.com/news/money/companies/1009280/grab-philippines-names-new-country-head/story/","title":"Grab Philippines names new country head"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"grab-philippines-appoints-cj-lacsican-as-new-count"},"buildId":"7hGQ23-fU4EHqCi-994Ap","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
