<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-7bc367af1df2b57e.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-609eda5bf9fae427.js" defer=""></script><script src="/_next/static/7hGQ23-fU4EHqCi-994Ap/_buildManifest.js" defer=""></script><script src="/_next/static/7hGQ23-fU4EHqCi-994Ap/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"export-banned-nvidia-chips-fuel-chinas-ai-ascent-a","contentHtml":"\u003cp\u003eA groundbreaking report by former OpenAI researchers suggests a troubling development in the global AI landscape: China's most powerful artificial intelligence models may have been developed using advanced Nvidia chips explicitly banned from export to the country. This revelation has ignited a firestorm of controversy, implicating Nvidia's leadership and casting a shadow over the effectiveness of US efforts to control the flow of cutting-edge AI hardware.\u003c/p\u003e\n\u003cp\u003eThe research, which analyzed the internal structures ('weights') of large language models from prominent Chinese firms including DeepSeek, Moonshot AI, MiniMax, and Ant Group, found tell-tale signs consistent with training on Nvidia’s high-performance Blackwell Graphics Processing Units (GPUs). These GPUs were placed under strict export restrictions by the US government, precisely to prevent China from accessing such advanced technology for its AI ambitions.\u003c/p\u003e\n\u003cp\u003eIntriguingly, the report indicates a recent shift in China's AI training practices. These Chinese companies reportedly began utilizing Blackwell GPUs for their advanced models only between April and October 2026. Earlier versions of their models, by contrast, showed characteristics of having been trained on less powerful, but still export-permitted, Nvidia H200 or Hopper chips.\u003c/p\u003e\n\u003cp\u003eThe scandal is further complicated by a reported 'honeypot' operation involving Nvidia’s now-former CEO, Jensen Huang, and a Chinese intelligence operative named Alice Huang, associated with the company Megaspeed. This connection has fueled suspicions of an illicit network facilitating China's access to the embargoed Blackwell chips. Further investigations uncovered that Aperia Cloud Services, a Singapore-based Nvidia cloud partner also linked to Alice Huang, was allegedly involved in smuggling banned Nvidia H800 chips to a data center in Shanghai. This led to Dell terminating its business relationship with Aperia in February 2025 due to legal concerns.\u003c/p\u003e\n\u003cp\u003eIn the wake of these allegations, Jensen Huang has resigned as Nvidia's CEO and is scheduled to testify before the House Foreign Affairs Committee. His testimony is expected to delve into the circumstances surrounding these alleged export control violations and Nvidia's potential corporate liability.\u003c/p\u003e\n\u003cp\u003eThe public reaction, as reflected in simulated social media sentiment, indicates a mix of positive commentary and ongoing debate. This suggests a multifaceted discussion encompassing concerns over geopolitical security, the integrity of export controls, and the intricate dynamics of the global tech industry and international relations.\u003c/p\u003e\n\u003cp\u003eThis unfolding story underscores the significant challenges in enforcing technological export restrictions and highlights the profound implications for companies like Nvidia, the individuals at their helm, and the broader geopolitical competition for AI supremacy. The alleged circumvention of these controls represents a critical moment in the ongoing technological arms race, with long-lasting consequences for innovation, national security, and global power balances.\u003c/p\u003e\n","title":"Export-Banned Nvidia Chips Fuel China's AI Ascent Amid Geopolitical Scrutiny","authors":[{"username":"@alanaturner","name":"Alana Turner"}],"date":"2026-11-16T03:54:01Z","summary":"A new report reveals that leading Chinese AI models from DeepSeek, Moonshot AI, MiniMax, and Ant Group were likely trained using Nvidia's export-restricted Blackwell GPUs, sparking a major controversy involving Nvidia's former CEO, Jensen Huang, and raising significant questions about the effectiveness of US export controls.","tags":["Nvidia","AI","China","Export Controls","Jensen Huang","Blackwell GPUs","Geopolitics","Technology"],"sources":[{"url":"https://sfist.com/2026/11/13/report-leading-chinese-ai-models-were-trained-on-nvidia-chips-china-wasnt-supposed-to-have/","title":"Report: Leading Chinese AI Models Were Trained on Nvidia Chips China Wasn't Supposed to Have"},{"url":"https://www.msn.com/en-us/news/other/export-banned-nvidia-chips-are-behind-china-s-most-powerful-ai-models-uh-oh-jensen/ar-AA2ho3ho?ocid=BingNewsVerp","title":"Export-banned Nvidia chips are behind China’s most powerful AI models—uh oh, Jensen!"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"export-banned-nvidia-chips-fuel-chinas-ai-ascent-a"},"buildId":"7hGQ23-fU4EHqCi-994Ap","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
