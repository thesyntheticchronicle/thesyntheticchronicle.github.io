<!DOCTYPE html><html><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><link rel="preload" href="/_next/static/css/0f953e58cdaad9b8.css" as="style"/><link rel="stylesheet" href="/_next/static/css/0f953e58cdaad9b8.css" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" noModule="" src="/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script src="/_next/static/chunks/webpack-cfb97e7cd53c187e.js" defer=""></script><script src="/_next/static/chunks/framework-2f335d22a7318891.js" defer=""></script><script src="/_next/static/chunks/main-dbd0de0e54d73d4c.js" defer=""></script><script src="/_next/static/chunks/pages/_app-7bc367af1df2b57e.js" defer=""></script><script src="/_next/static/chunks/pages/posts/%5Bslug%5D-609eda5bf9fae427.js" defer=""></script><script src="/_next/static/7hGQ23-fU4EHqCi-994Ap/_buildManifest.js" defer=""></script><script src="/_next/static/7hGQ23-fU4EHqCi-994Ap/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"postData":{"id":"philippines-carmelle-crowned-champion-at-inaugural","contentHtml":"\u003cp\u003eThe Philippines has achieved a landmark victory in the world of music, as 19-year-old Carmelle was crowned the champion of the inaugural Eurovision Song Contest Asia. Held in Bangkok, Thailand, on November 14, 2026, Carmelle captivated both judges and audiences with her dynamic women's empowerment anthem, \"Sobra-Sobra.\"\u003c/p\u003e\n\u003cp\u003eCarmelle, the youngest performer in the competition, delivered a memorable performance that included a compelling rap section, quickly becoming a favorite. She amassed a remarkable 211 points, a total derived from a combination of 93 points from national juries and 118 points from the public vote, which notably included a 'rest-of-the-world' component.\u003c/p\u003e\n\u003cp\u003eThe competition saw strong contenders from across Asia. Thailand's duo MANG x DAOU secured second place with 170 points for their emotional duet \"Aroma,\" while Vietnam's Toc Tien rounded out the top three with 164 points. Other standout acts included Bangladesh's Beatmosphere, who innovatively used beatboxing as their entire backing track, and Laos's Thinla, who performed \"Bae\" while adorned in a traditional Lao hilltribe outfit, adding a rich cultural dimension to the event.\u003c/p\u003e\n\u003cp\u003eThe grand event wasn't just about the competition; it also featured special guest appearances. Bulgarian singer Dara, the winner of the 2026 Eurovision Song Contest, graced the stage, as did popular Thai singer Jeff Satur, adding to the spectacle and excitement.\u003c/p\u003e\n\u003cp\u003eWhile the inaugural contest enjoyed a largely positive reception among fans, the long-term future of Eurovision Song Contest Asia still holds some uncertainties. Questions regarding sustained attendance and the commitment of regional broadcasters for future editions, as well as potential expansion beyond the initial 11 participating countries, remain open. Nevertheless, social media sentiment surrounding the event and Carmelle's historic win has been overwhelmingly positive, reflecting a collective celebration of this new chapter in Asian music.\u003c/p\u003e\n","title":"Philippines' Carmelle Crowned Champion at Inaugural Eurovision Song Contest Asia","authors":[{"username":"@miguelreyes","name":"Miguel Reyes"}],"date":"2026-11-16T15:24:21Z","summary":"Nineteen-year-old Carmelle from the Philippines made history by winning the first-ever Eurovision Song Contest Asia in Bangkok with her empowering anthem \"Sobra-Sobra.\"","tags":["Philippines","Eurovision Asia","Carmelle","Sobra-Sobra","Music Contest","Thailand","Entertainment","Pop Music","Asian Music"],"sources":[{"url":"https://ijr.com/discover/entertainment-2026-11-12-philippines-wins-inaugural-eurovision-asia-51b0b101","title":"Philippines Wins Inaugural Eurovision Asia"},{"url":"https://thethaiger.com/news/national/philippines-wins-first-eurovision-asia-bangkok","title":"Philippines wins first Eurovision Asia contest in Bangkok"},{"url":"https://www.msn.com/en-us/entertainment/general/philippines-wins-inaugural-eurovision-song-contest-asia-in-thailand/ar-AA2hrnOG","title":"Philippines wins inaugural Eurovision Song Contest Asia in Thailand"},{"url":"https://www.aol.com/articles/philippines-wins-inaugural-eurovision-asia-053950000.html","title":"Philippines wins inaugural Eurovision Asia as 19-year-old makes history"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"philippines-carmelle-crowned-champion-at-inaugural"},"buildId":"7hGQ23-fU4EHqCi-994Ap","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
