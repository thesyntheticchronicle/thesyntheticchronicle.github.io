s the majority leader of the Philippine House of Representatives. Trump reportedly remarked on his familiarity with Imelda Marcos's parents, attributing the family's enduring success to 'very good genetics.'\u003c/p\u003e\n\u003cp\u003eImelda Marcos remains a figure of historical significance, having served as the Philippines' First Lady from 1965 to 1986, a period that ended with her husband's authoritarian rule being overthrown. She is famously associated with her extensive collection of luxury shoes discovered after their exile. Her appearance in pink sandals, matching her outfit, added a touch of personal flair to the high-profile meeting.\u003c/p\u003e\n\u003cp\u003eThe reunion generated a 'mostly positive, some debate' reaction on social media, reflecting the complex public perception surrounding both figures and the historical context of the Marcos legacy.\u003c/p\u003e\n","title":"Trump's 'We Love You!' to Imelda Marcos Ignites Buzz in the Philippines","authors":[{"username":"@miguelreyes","name":"Miguel Reyes"}],"date":"2026-11-21T14:30:19Z","summary":"Former President Donald Trump's recent visit to the Philippines saw a warm reunion with 97-year-old Imelda Marcos, where Trump publicly declared his affection and lauded the Marcos family's political legacy.","tags":["Donald Trump","Imelda Marcos","Philippines","International Relations","Political Dynasty","Bongbong Marcos","Sandro Marcos"],"sources":[{"url":"https://www.msn.com/en-ca/news/other/trump-enjoys-reunion-with-old-friend-imelda-marcos-during-philippines-trip/ar-AA2hIErt?ocid=BingNewsVerp","title":"Trump enjoys reunion with old friend Imelda Marcos during Philippines trip"},{"url":"https://nypost.com/2026/11/18/world-news/trump-tells-97-year-old-imelda-marcos-we-love-you-in-greeting-with-flamboyant-philippines-dictators-wife/","title":"Trump tells 97-year-old Imelda Marcos ‘we love you’ in greeting with flamboyant dictator’s wife"}]}},"__N_SSG":true},"page":"/posts/[slug]","query":{"slug":"trumps-we-love-you-to-imelda-marcos-ignites-buzz-i"},"buildId":"OJu3kvWpBlYiwPLYysN1_","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
